"""
One shared schema across every consortium QUOTA anchors. The composability
claim: the same query shape works for any consortium, with only the id
changing -- nothing here is Bronte-specific, even though Bronte is the only
consortium with real data today.
"""
type Consortium @entity(immutable: false) {
  id: Bytes! # consortiumId
  seasons: [Season!]! @derivedFrom(field: "consortium")
  participants: [Participant!]! @derivedFrom(field: "consortium")
}

type Season @entity(immutable: false) {
  id: Bytes! # seasonId
  consortium: Consortium!
  year: BigInt!
  hederaTokenId: String!
  ensNode: Bytes!

  # Canonical parameter, read live from ENS by QuotaAnchor at openSeason --
  # this schema stores what the contract read, not a separate source of truth.
  capGrams: BigInt!

  # Derived fields, computed in mappings on every relevant event, not at
  # query time -- so they're plain fields, not @derivedFrom aggregations.
  mintedGrams: BigInt!
  retiredGrams: BigInt!
  inCirculationGrams: BigInt! # mintedGrams - retiredGrams
  utilisationBp: BigInt! # floor(mintedGrams * 10000 / capGrams)

  mints: [Mint!]! @derivedFrom(field: "season")
  transfers: [Transfer!]! @derivedFrom(field: "season")
  lots: [Lot!]! @derivedFrom(field: "season")
  retirements: [Retirement!]! @derivedFrom(field: "season")
  transformationsAsInput: [Transformation!]! @derivedFrom(field: "inputSeason")
  transformationsAsOutput: [Transformation!]! @derivedFrom(field: "outputSeason")
  unauthorizedMints: [UnauthorizedMint!]! @derivedFrom(field: "season")
  unauthorizedRetirementOutflows: [UnauthorizedRetirementOutflow!]! @derivedFrom(field: "season")
}

type Participant @entity(immutable: false) {
  id: Bytes! # address
  consortium: Consortium!
  role: String!
  registeredAt: BigInt!
  transactionHash: Bytes!
}

"""
A lot aggregates everything anchored against the same lotRef within a
season: the harvest mint that created it, transformations it went through
(as input or as output, since a lot's identifier persists across the
product it becomes), and retirements against it. A lotRef is scoped to one
season -- the same lotRef in a different season (e.g. the derived-product
season a lot's grams become after transformation) is a different Lot
entity, linked to it via Transformation.inputLot/outputLot.
"""
type Lot @entity(immutable: false) {
  id: String! # `${seasonId}-${lotRef}`
  season: Season!
  lotRef: String!
  totalRetiredGrams: BigInt!
  mints: [Mint!]! @derivedFrom(field: "lot")
  retirements: [Retirement!]! @derivedFrom(field: "lot")
  transformationsAsInput: [Transformation!]! @derivedFrom(field: "inputLot")
  transformationsAsOutput: [Transformation!]! @derivedFrom(field: "outputLot")
}

"""
The harvest (or output-product) mint that brings a lot into existence.
lotRef is assigned at mint time -- a lot's identity starts here, not at
retirement.
"""
type Mint @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  season: Season!
  lot: Lot!
  to: Bytes!
  grams: BigInt!
  hederaTxId: String!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""
A custody transfer within a season. Not lot-attributed at the contract
level -- lotRef is only carried by Mint and Transformation -- so a
transfer is shown alongside a lot's journey by season and time, not by a
direct link. Honest about the granularity the underlying event actually
has, rather than implying a precision the data doesn't carry.
"""
type Transfer @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  season: Season!
  from: Bytes!
  to: Bytes!
  grams: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Retirement @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  season: Season!
  lot: Lot!
  grams: BigInt!
  hederaTxId: String!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""
inputLot and outputLot are two DIFFERENT Lot entities (different seasons,
same lotRef string) -- a transformation is where a lot's identity crosses
from the input product's season into the output product's season. yieldBp
is always what the contract itself read live from ENS and enforced as a
ceiling on outputGrams, never a caller-supplied value.
"""
type Transformation @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  inputSeason: Season!
  inputLot: Lot!
  inputGrams: BigInt!
  outputSeason: Season!
  outputLot: Lot!
  outputGrams: BigInt!
  productType: String!
  yieldBp: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""
A Hedera mint transaction with no matching UnitsMinted anchor event.
Anchored by an off-chain reconciler (not this subgraph -- subgraph mappings
can't call the Hedera mirror node) that compares full mirror-node mint
history against this contract's own anchor history. See CLAUDE.md.
"""
type UnauthorizedMint @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  season: Season!
  grams: BigInt!
  hederaTxId: String!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""
A retirement account paid out grams it should only ever have received.
Same bridging story as UnauthorizedMint, for the retirement side --
see the relayer's checkRetirementTripwire and CLAUDE.md.
"""
type UnauthorizedRetirementOutflow @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  season: Season!
  grams: BigInt!
  hederaTxId: String!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
